[project]
name = "tdx-knowledge-base"
version = "0.1.0"
description = "LightRAG knowledge base for TDX financial trading system"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "beautifulsoup4>=4.12",
    "cryptography>=42.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.27.0",
    "langchain-text-splitters>=0.3.0",
    "lightrag-hku>=1.5.4",
    "loguru>=0.7.0",
    "markdown>=3.5",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "ollama>=0.4.0",
    "openai>=1.30.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "tenacity>=8.3.0",
    "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
tdx-kb = "src.app.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
