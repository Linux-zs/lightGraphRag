answer_generation:
  system_prompt: 你是知识库助手。必须使用简体中文回答。只依据给定参考资料回答；资料不足时明确说“知识库上下文不足”。参考资料只作为依据，不要把原文逐条搬运成答案。你需要先理解用户问题，再综合多条资料，按原因、链路、排查步骤或结论组织成通顺、有逻辑的说明。回答要结构清晰，使用正常的
    Markdown 标题和有序列表。不要输出 References/引用文档列表，不要输出 assistant/user 角色名，不要复述大段原始脚本，不要输出孤立的编号或字母。引用资料时在相关句子末尾使用
    [数字] 标记，数字必须来自参考资料编号。
chunking:
  chunk_overlap: 100
  # chunk 越大，chunk 数越少，实体抽取的 LLM 调用次数就越少（等效"批量抽取"）。
  # 1024 token/块 ≈ 调用次数减半。注意：嵌入端会按 480 token 截断做向量，块过大将
  # 损失部分向量召回精度，不建议超过 1536。
  chunk_size: 1024
  separators:
  - '


    '
  - '

    '
  - 。
  - ！
  - ？
  - ；
  - ' '
  - ''
embedding:
  batch_size: 32
  normalize: true
lightrag:
  entity_extraction_use_json: true
  # 实体抽取的“查漏补缺”轮数。1 = 每块抽两遍（质量高但 LLM 调用 ×2）；
  # 0 = 只抽一遍，调用次数减半（推荐，7B 级模型 gleaning 增益很小）。
  entity_extract_max_gleaning: 0
  # 限制单个文本块一次抽取返回的候选规模，避免模型把普通短语和弱关系全部写入图谱。
  # 只影响未来索引；已有知识图谱需要重建索引才能生效。
  entity_extract_max_entities: 24
  entity_extract_max_records: 48
  # 并发调用大模型的最大数量。提高可加快索引，但可能触发接口限流。
  # 付费/Pro 档可到 8~16；免费档模型限流严格，调高也没用。
  llm_model_max_async: 8
  # 混合思考型模型（Qwen3/GLM-4.5+/DeepSeek-V3.1+ 等）默认开启隐藏思维链，
  # 单次抽取可拖慢到 60~300 秒且易返回空 JSON。true = 自动关闭思考模式（推荐）。
  disable_thinking: true
  # KG 抽取前跳过明显低价值 chunk（空白、纯符号、目录/表格/代码噪声）。
  # 向量索引仍保留这些 chunk，只是不把它们送进实体关系抽取。
  kg_skip_low_value_chunks: true
  kg_min_substantive_chars: 8
  kg_symbol_ratio_threshold: 0.78
  kg_structured_line_ratio: 0.72
  # 单个 KG chunk 超时不应拖垮整份文档。超时 chunk 仍保留文本和向量，
  # 只跳过该块的实体关系抽取；超过上限后才终止文档索引。
  kg_skip_timed_out_chunks: true
  kg_max_timed_out_chunks: 3
  workspace: tdx_default
llm:
  backend: siliconflow
  max_tokens: 4096
  repetition_penalty: 1.05
  temperature: 0.7
  top_k: 10
  top_p: 0.9
ollama:
  host: http://localhost:11434
  model: qwen2.5:7b
  timeout: 60
paths:
  data_dir: ./data
  docs_dir: ./docs
  lightrag_dir: ./data/lightrag
  lightrag_manifest: ./data/lightrag_manifest.json
  log_dir: ./data/logs
siliconflow:
  api_key: ''
  base_url: https://api.siliconflow.cn/v1
  chat_max_tokens: 4096
  chat_model: Qwen/Qwen2.5-7B-Instruct
  chat_temperature: 0.7
  chat_top_p: 0.9
  embed_dim: 1024
  embed_max_chars: 480
  embed_max_tokens: 480
  embed_model: BAAI/bge-large-zh-v1.5
  frequency_penalty: 0.3
  # KG 抽取使用独立的生成预算和超时。限制输出长度可减少模型在单块上
  # 长时间生成；LightRAG worker 超时约为此值的 2 倍。
  kg_max_tokens: 1536
  kg_timeout: 90
  presence_penalty: 0.2
  rerank_model: BAAI/bge-reranker-v2-m3
  timeout: 90
